[project]
name = "archivebench"
version = "0.1.0"
description = "Repeatable local video archival benchmarks with offline interactive reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Source = "https://github.com/Today20092/ArchiveBench"
Issues = "https://github.com/Today20092/ArchiveBench/issues"
Documentation = "https://github.com/Today20092/ArchiveBench#readme"

[project.scripts]
archivebench = "archivebench.cli:main"
archivebench-skill = "archivebench.skill:main"
archivebench-send-to = "archivebench.send_to:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14,<1", "ty>=0.0.1,<1", "pytest>=8,<10"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.11"

[tool.hatch.build.targets.wheel]
packages = ["archivebench"]

[tool.hatch.build.targets.wheel.force-include]
"skills/archivebench" = "archivebench/_skill"

[tool.hatch.build.targets.sdist]
exclude = ["/.scratch"]
