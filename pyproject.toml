[project]
name = "archivebench"
version = "0.1.0"
description = "Repeatable local video archival benchmarks with offline interactive reports"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
archivebench = "archivebench.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff>=0.14,<1", "ty>=0.0.1,<1", "pytest>=8,<10"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ty.environment]
python-version = "3.11"

[tool.hatch.build.targets.wheel]
packages = ["archivebench"]
