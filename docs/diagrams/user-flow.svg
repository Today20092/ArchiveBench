<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="user-flow-title user-flow-desc" id="user-flow-root">
        <title id="user-flow-title">Use ArchiveBench</title>
        <desc id="user-flow-desc">Check tools, save an experiment, benchmark, compare and review footage, export settings, then archive while keeping originals.</desc>
        <defs>
      <style>#user-flow-root { --color-paper: #f5f5f5; --color-ink: #2d3142; --color-muted: #4f5d75; --color-accent: #bf4520; }
      #user-flow-root { color: var(--color-ink); font-family: 'Geist', system-ui, sans-serif; }
      #user-flow-root a { color: #2e5aa8; }
      #user-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #user-flow-root .node { fill: #f5f5f5; stroke: #4f5d75; stroke-width: 1.5; }
      #user-flow-root .focal { fill: #f5f5f5; stroke: #bf4520; stroke-width: 2; }
      #user-flow-root .name { font: 600 12px 'Geist', system-ui, sans-serif; fill: #2d3142; }
      #user-flow-root .detail { font: 400 11px 'Geist', system-ui, sans-serif; fill: #4f5d75; }
      #user-flow-root .command { font: 400 9px 'Geist Mono', ui-monospace, monospace; fill: #4f5d75; }
      #user-flow-root .title { font: 400 28px 'Instrument Serif', serif; fill: #2d3142; }
      #user-flow-root .edge { fill: none; stroke: #4f5d75; stroke-width: 1.5; marker-end: url(#user-flow-user-flow-arrow); }
      #user-flow-root .diagram-container { overflow-x: visible; }</style><marker id="user-flow-user-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker></defs>
        <rect width="960" height="600" fill="#f5f5f5"/>
        <text class="title" x="40" y="52">Measure first. Review before archiving.</text>
        <text class="detail" x="40" y="80">Read left to right, then follow the arrow to the second row.</text>
        <path class="edge" d="M 296 172 H 348"/>
        <path class="edge" d="M 608 172 H 660"/>
        <path class="edge" d="M 788 232 V 264 Q 788 272 780 272 H 176 Q 168 272 168 280 V 308"/>
        <path class="edge" d="M 296 372 H 348"/>
        <path class="edge" d="M 608 372 H 660"/>
        <rect class="node" x="40" y="112" width="256" height="120" rx="6"/>
        <text class="name" x="56" y="140">1. Check the tools</text>
        <text class="detail" x="56" y="164">Install uv and FFmpeg with libvmaf.</text>
        <text class="detail" x="56" y="184">Check the listed encoders.</text>
        <text class="command" x="56" y="212">archivebench doctor</text>
        <rect class="node" x="352" y="112" width="256" height="120" rx="6"/>
        <text class="name" x="368" y="140">2. Save the experiment</text>
        <text class="detail" x="368" y="164">Choose tuning and validation samples.</text>
        <text class="detail" x="368" y="184">Set variants, targets, repeats and budget.</text>
        <text class="command" x="368" y="212">archivebench setup</text>
        <rect class="node" x="664" y="112" width="256" height="120" rx="6"/>
        <text class="name" x="680" y="140">3. Run the benchmark</text>
        <text class="detail" x="680" y="164">Screen, tune and check fresh samples.</text>
        <text class="detail" x="680" y="184">Save results and the offline report.</text>
        <text class="command" x="680" y="212">archivebench benchmark</text>
        <rect class="focal" x="40" y="312" width="256" height="120" rx="6"/>
        <text class="name" x="56" y="340">4. Compare and review</text>
        <text class="detail" x="56" y="364">Compare quality, video size and time.</text>
        <text class="detail" x="56" y="384">Review stills, motion and exact clips.</text>
        <text class="command" x="56" y="412">report.html + review/</text>
        <rect class="node" x="352" y="312" width="256" height="120" rx="6"/>
        <text class="name" x="368" y="340">5. Export the selected settings</text>
        <text class="detail" x="368" y="364">Save archive settings for the runner.</text>
        <text class="detail" x="368" y="384">Copy the prompt for an agent handoff.</text>
        <text class="command" x="368" y="412">Selected-settings handoff</text>
        <rect class="node" x="664" y="312" width="256" height="120" rx="6"/>
        <text class="name" x="680" y="340">6. Archive and keep originals</text>
        <text class="detail" x="680" y="364">Review the dry run before encoding.</text>
        <text class="detail" x="680" y="384">Check the MKV output and manifest.</text>
        <text class="command" x="680" y="412">archivebench archive</text>
        <text class="detail" x="40" y="476">Cleanup permanently deletes originals. It requires a separate command after visual review and verification.</text>
        <line x1="40" y1="528" x2="920" y2="528" stroke="#bfc0c0"/>
        <rect class="node" x="40" y="548" width="16" height="16" rx="2"/>
        <text class="detail" x="68" y="560">Action</text>
        <rect class="focal" x="176" y="548" width="16" height="16" rx="2"/>
        <text class="detail" x="204" y="560">Review before acceptance</text>
      </svg>
